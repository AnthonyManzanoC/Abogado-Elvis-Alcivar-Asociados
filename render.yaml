services:
  - type: web
    name: alcivar-legal-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build -w @alcivar/api
    preDeployCommand: npm run migrate -w @alcivar/api
    startCommand: npm run start -w @alcivar/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        value: certs/supabase-root-2021.crt
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CONFIG_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_API_URL
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: alcivar-uploads
      mountPath: /var/data
      sizeGB: 5
